schema: spec-driven

context: |
  Product: iOS app for tracking gym workouts. The user records each exercise
  in a session as either repetitions (sets x reps, optional weight) or
  time-based duration, then saves the whole session as a reusable routine.
  An AI service suggests the next day's routine based on workout history.

  Domain model essentials:
  - Exercise: name, category, and explicit muscle-target metadata (primary
    and secondary muscles). Muscle data is required — it is what makes the
    AI suggestions accurate.
  - Workout session: an ordered list of performed exercises with their
    reps/time/weight values, saved as a named routine.
  - Exercise catalog: bundled with the app (predefined library including
    muscle targets); users can add custom exercises.

  Tech stack (iOS app — the deliverable of this project):
  - Swift, SwiftUI, SwiftData for local persistence (iOS 17+).
  - Local-only storage, no user accounts, no cloud sync. The only network
    traffic is calls to the AI suggestion endpoint.

  AI backend:
  - The app calls the OpenRouter API directly (POST
    https://openrouter.ai/api/v1/chat/completions) with a user-provided
    API key stored in the Keychain; there is no separate backend service.
  - OpenRouter is an external dependency defined by its REST contract:
    requests use structured outputs (strict JSON schema over catalog
    exercise IDs), and responses are validated client-side against the
    local exercise store before anything reaches the UI.
  - The app must degrade gracefully when OpenRouter is unreachable or no
    API key is configured (tracking always works offline; suggestions are
    optional).

rules:
  proposal:
    - Scope proposals to the iOS app; treat the backend as an external
      dependency defined only by its REST contract.
  specs:
    - Any spec involving exercises must account for muscle-target metadata.
    - Specs touching AI suggestions must reference the REST API contract
      rather than assuming inference happens on-device.
  tasks:
    - Break tasks into chunks of max 2 hours.
    - Tasks must not depend on the backend existing; use the API contract
      and mock/stub responses for development and tests.
